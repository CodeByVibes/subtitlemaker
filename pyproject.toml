[project]
name = "subtitlemaker"
dynamic = ["version"]
description = "Generate subtitles from audio and video files using faster-whisper."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johan Isevind", email = "codebyvibes@isevind.se" }]
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.2.1",
    "ctranslate2>=4.6,<5",
    "numpy>=1.22",
    "av>=13,<17",
    "rich>=13",
    "tomli>=2; python_version < '3.11'",
]
keywords = ["subtitles", "srt", "vtt", "whisper", "faster-whisper", "transcription", "speech-to-text"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/CodeByVibes/subtitlemaker"
Issues = "https://github.com/CodeByVibes/subtitlemaker/issues"
Changelog = "https://github.com/CodeByVibes/subtitlemaker/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]
# The desktop app. Essentials has everything a Widgets app needs; the larger
# Addons package (e.g. QtMultimedia) is not required. 6.8 is the first
# release that supports Python 3.13. Below 6.12: PySide6 6.12.0 leaks a
# reference to None on every call that returns nothing, which aborts the
# interpreter after a few thousand calls on Python 3.10 and 3.11 (3.12 and up
# are immune). See tests/gui/test_pyside_health.py before raising the cap.
gui = [
    "PySide6-Essentials>=6.8,<6.12",
]

[project.scripts]
subtitlemaker = "subtitlemaker.cli:main"

[project.gui-scripts]
subtitlemaker-gui = "subtitlemaker.gui:main"

[dependency-groups]
# Only for building the standalone apps (packaging/build.py), in an environment of its own.
build = [
    "pyinstaller>=6.11",
]
dev = [
    "mypy>=2.4.1",
    "pytest>=8",
    # The desktop app's tests; a developer gets the GUI without asking for it.
    "pytest-qt>=4.4",
    "PySide6-Essentials>=6.8,<6.12",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/subtitlemaker/__init__.py"

# Only these go into the source distribution. An allow-list means a stray
# local file can never end up on PyPI.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/packaging",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/subtitlemaker"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: slow tests that run a real Whisper model (run with: pytest -m integration)",
]

[tool.mypy]
strict = true
files = ["src"]

# faster-whisper, ctranslate2, onnxruntime and tqdm ship no type information.
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "ctranslate2", "onnxruntime", "tqdm", "tqdm.*"]
ignore_missing_imports = true
