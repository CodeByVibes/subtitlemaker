[project]
name = "subtitlemaker"
dynamic = ["version"]
description = "Generate subtitles from audio and video files using faster-whisper."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johan Isevind", email = "codebyvibes@isevind.se" }]
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.2.1",
    "av>=13,<17",
    "rich>=13",
    "tomli>=2; python_version < '3.11'",
]
keywords = ["subtitles", "srt", "vtt", "whisper", "faster-whisper", "transcription", "speech-to-text"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/CodeByVibes/subtitlemaker"
Issues = "https://github.com/CodeByVibes/subtitlemaker/issues"
Changelog = "https://github.com/CodeByVibes/subtitlemaker/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]

[project.scripts]
subtitlemaker = "subtitlemaker.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/subtitlemaker/__init__.py"

# Only these go into the source distribution. An allow-list means a stray
# local file can never end up on PyPI.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/subtitlemaker"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: slow tests that run a real Whisper model (run with: pytest -m integration)",
]
