[project]
name = "subtitlemaker"
version = "0.0.1"
description = "Generate subtitles from audio and video files using faster-whisper."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Johan Isevind", email = "codebyvibes@isevind.se" }]
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1",
    "av>=11,<17",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]

[project.scripts]
subtitlemaker = "subtitlemaker.subs:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitlemaker"]
