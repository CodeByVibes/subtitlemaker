name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest

  # The lowest versions the package claims to support still have to work.
  lowest-versions:
    name: Lowest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv run --resolution lowest-direct pytest

  # Runs a real (tiny) Whisper model on the CPU.
  integration:
    name: Integration (tiny model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-whisper-tiny-v1
      - run: uv sync --locked
      - run: uv run pytest -m integration

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv build
      - name: Check the package metadata
        run: uvx twine check --strict dist/*
